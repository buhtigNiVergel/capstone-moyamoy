<!DOCTYPE html>
<html>
  <head>
    <title>Lesson 4 exercise</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            margin-top: none;
            margin-bottom: none;
        }

        .container{
            display: flex;
            flex-direction: column;
        }

        .input-text{
            width: 250px;
            border-radius: 5px;
            border-width: 1px;
            padding-top: 5px;
            padding-bottom: 5px;
        }

        .button{
            width: 100px;
            background-color: lightblue;
            padding-top: 5px;
            padding-bottom: 5px;
            border-width: 1px;
            border-radius: 5px;
        }

        .button-container{
            display: flex;
            margin-top: 15px;
            gap: 8px;
        }
        
        .email{
            margin-bottom: 5px;
        }

        .password{
            margin-right: 5px;
        }

        .timer-button{
            background-color: rgb(25, 135, 84);
        }

        .timer-button.container{
            height: 100vh;
            display: flex;
            justify-content: center;
            background-color: rgb(222, 222, 222);
            align-items: center;
            flex-direction: column;
        }
    </style>
  </head>
  <body>
    <div class="js-container"></div>
    
    <script src="https://unpkg.com/supersimpledev/dayjs.js"></script>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
        function App(){
            return(
                <>
                    <Timer />
                </>
            
            )
        }

        function Timer(){
            const [time, setTime] = React.useState(dayjs().format('HH:mm:ss'));
            const [count, setCount] = React.useState(0);
            const buttonRef = React.useRef(null)

            React.useEffect(() => {
            setInterval(() => {
                setTime(dayjs().format('HH:mm:ss'));

            }, 1000);
            console.log('vergel pogi');
            }, []);

            function increaseCount() {
            setCount(count + 1);
            }

            function reset(){
                setCount(0);
            }

            function autoClick(){
                setInterval(() => {
                buttonRef.current.click();
                console.log('run');
            }, 1000)
            }

            return(
                <>
                    <p>Current time: {time}</p>
                    <div className='timer-button-container'>
                        <button onClick={increaseCount}
                            ref = {buttonRef}
                            className = 'timer-button'>
                            Clicked {count} {count === 1 ? 'time' : 'times'}
                    
                        </button>
                        <button onClick = {reset}
                                className = 'timer-button'>reset
                        </button>
                        <button onClick = {autoClick}
                                className = 'timer-button'>Auto Click
                        </button>
                    </div>
                </>
            )
        }

        function Login() {
            const [showPassword, setShowPassword] = React.useState(false);

            function setPassword(){
                if(showPassword === false){
                    setShowPassword(true)
                }else if(showPassword === true){
                    setShowPassword(false)
                }

                console.log(showPassword);
            }
            return(
                <>
                    <div className = 'container'>
                        <h1>Hello, welcome to my website</h1>

                        <input  type="text" 
                                required
                                placeholder = "email"
                                className = 'input-text email'/>
                        <div className = 'password-container'>
                            <input  type={showPassword === false ? 'password' : 'text'} 
                                    required
                                    placeholder = 'password'
                                    className = 'input-text password'/> 
                            <button onClick = {setPassword}
                                className = 'password-button'>show</button>
                        </div>

                        <div className='button-container'>
                            <button className='button'>Login</button>
                            <button className='button'>Sign up</button>        
                        </div>
                    </div>
                </>
            )
        }

      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
