<!DOCTYPE html>
<html>
  <head>
    <title>React Basics</title>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
      function App() {
        return(
            <>
                <ProductDetails 
                    product = "Cotton socks" 
                    price = "10.90" 
                    discountPrice = "5.45" 
                    imageSrc = "L2-images/cotton-socks.png" 
                />
                <ProductDetails 
                    product = "Tennis balls" 
                    price = "6.00" 
                    discountPrice = "3.00" 
                    imageSrc = "L2-images/tennis-balls.png"
                />
                <ProductDetails 
                    product = "Plain T-Shirt" 
                    price = "7.99" 
                    imageSrc = "L2-images/plain-t-shirt.png"
                />
            </>
        )
      }

      function ProductDetails( {product, price, discountPrice, imageSrc} ){
        return(
            <>
                <img src={imageSrc} alt="" />
                <p>{product}</p>
                {
                    discountPrice ? (
                        <>
                            <del><p>Price: ${price}</p></del>
                            <p>Discount Price: ${discountPrice}</p>
                        </>
                    ) : (<p>Price: ${price}</p>)
                }
                <div><button>Add to Cart</button></div>
            </>
        )
      }

      const container = document.querySelector('.js-container');
      const root = ReactDOM.createRoot(container);
      root.render(<App/>);
    </script>
  </body>
</html>
